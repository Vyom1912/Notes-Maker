<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icone.png" />
    <title>PatelKeeps</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="heading">
      <h1><i class="fa-solid fa-note-sticky"></i> PatelKeeps</h1>
    </header>

    <div class="container">
      <div class="toolbar">
        <label class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="search"
            id="search"
            placeholder="Search notes..."
            aria-label="Search notes" />
        </label>

        <button class="learn-more" id="add" type="button">
          <span class="circle" aria-hidden="true">
            <span class="icon arrow"></span>
          </span>
          <span class="button-text">Add note</span>
        </button>
      </div>

      <p class="empty" id="empty" hidden></p>
      <main class="note-container" id="notes"></main>
    </div>

    <footer class="footer">
      <p>
        &copy; 2025 PatelKeeps. Designed and developed by Vyom Patel. All
        rights reserved.
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
